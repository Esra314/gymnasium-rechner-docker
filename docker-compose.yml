services:


  web:

    image: gymnasium-rechner-berlin-main-web:latest

    container_name: gymnasium-web

   


    ports:

      - "5000:5000"


    depends_on:

      - db

    deploy:
      replicas: 5
      update_config:
        parallelism: 2
        delay: 10s
        order: stop-first

    environment:

      DB_HOST: db

      DB_NAME: gymnasium

      DB_USER: postgres

      DB_PASSWORD: geheim
    
    networks:
      - gymnasium-over-net


  db:

    image: postgres:16



    deploy:
      replicas: 5
      update_config:
        parallelism: 2
        delay: 10s
        order: stop-first
   


    container_name: gymnasium-db




    networks:
      - gymnasium-over-net


    environment:

      POSTGRES_DB: gymnasium

      POSTGRES_USER: postgres

      POSTGRES_PASSWORD: geheim


    volumes:

      - postgres_data:/var/lib/postgresql/data


volumes:

  postgres_data:

networks:
  gymnasium-over-net:
    driver: overlay